name: Копия расписания ТулГУ
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/tulsu/groups.txt', 'scripts/tulsu-cache.mjs', '.github/workflows/tulsu.yml']
permissions:
  contents: write
concurrency: tulsu
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/tulsu-cache.mjs
      - name: Сохранить изменения
        run: |
          git config user.name 'vkysnasa1'
          git config user.email 'vkysnasa1@users.noreply.github.com'
          git add data/tulsu
          if git diff --cached --quiet; then
            # GitHub выключает запуск по расписанию, если в репозитории 60 дней ничего не происходит
            # (например, в каникулы расписание не меняется). Раз в 50 дней тишины — пустой коммит
            age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
            [ "$age" -lt 4320000 ] && exit 0
            git commit --allow-empty -m 'Расписание ТулГУ без изменений, проверка жива'
          else
            git commit -m 'Обновлена копия расписания ТулГУ'
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
