name: Копия расписания ТулГУ
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/tulsu/groups.txt', 'scripts/tulsu-cache.mjs', '.github/workflows/tulsu.yml']
permissions:
  contents: write
concurrency: tulsu
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/tulsu-cache.mjs
      - name: Сохранить изменения
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
          git add data/tulsu
          git diff --cached --quiet && exit 0
          git commit -m 'Обновлена копия расписания ТулГУ'
          git pull --rebase origin main
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
